name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  package:
    name: wheel ships its data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m venv /tmp/wheel-env && /tmp/wheel-env/bin/pip install dist/*.whl
      # Run from /tmp so the import resolves to the installed wheel, not the checkout.
      - working-directory: /tmp
        run: |
          /tmp/wheel-env/bin/python -W error -c "from anthropic_prospector.mock import fixture_profiles; assert fixture_profiles()"
          /tmp/wheel-env/bin/prospector --version
          /tmp/wheel-env/bin/prospector qualify lexiconlegal.example --offline
          /tmp/wheel-env/bin/prospector territory-batch "$GITHUB_WORKSPACE/targets.csv" --offline --out-dir /tmp/prospector-out

  min-deps:
    name: test (lowest direct deps, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install uv
      - run: uv pip install --system --resolution lowest-direct -e ".[dev]"
      - run: pytest
